server:
  port: ${PORT:8085}
  servlet:
    context-path: /chat
spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: ${MONGO_DB_URI:mongodb://root:123456@localhost:27017/chat-service?authSource=admin}
      auto-index-creation: true

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:8081/profile}
    identity:
      url: ${IDENTITY_SERVICE_URL:http://localhost:8080/identity}
