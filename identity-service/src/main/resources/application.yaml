server:
  port: 8080
  servlet:
    context-path: /identity

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity-service}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  signerKey: ${JWT_SIGNER_KEY:ksRysNJBznui5E3rQ1LQE5g+u3IR+RxJoXIF9ob7eZQeWuzsh2u2nYlrgeY5XqYD}
  valid-duration: ${JWT_VALID_DURATION:3600} # in second
  refreshable-duration: ${JWT_REFRESH_DURATION:36000} # in seconds

app:
  services:
    profile: ${PROFILE_SERVICE_URL:http://localhost:8081/profile}