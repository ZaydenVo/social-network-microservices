server:
  port: ${PORT:8082}
  servlet:
    context-path: /notification
spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGO_DB_URI:mongodb://root:123456@localhost:27017/notification-service?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
notification:
  email:
    brevo-url: ${BREVO_URL:http://api.brevo.com}
    brevo-apikey: ${BREVO_API_KEY:<key>}

app:
  api-key: ${APP_API_KEY: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}