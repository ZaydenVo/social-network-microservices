server:
  port: ${PORT:8084}
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/file-service?authSource=admin}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:D:/upload}
    download-prefix: ${FILE_DOWNLOAD_PREFIX:http://localhost:8888/api/file/media/download/}

